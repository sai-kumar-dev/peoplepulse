name: main-artifacts

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,dbt]"
      - run: pytest
      - name: Build tagged API image
        run: docker build --target runtime -f infrastructure/docker/app.Dockerfile -t peoplepulse-api:${GITHUB_SHA} .
      - uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            coverage.xml
            dbt/target/
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/peoplepulse-api:${GITHUB_REF_NAME}"
          docker tag "peoplepulse-api:${GITHUB_SHA}" "${IMAGE}"
          docker push "${IMAGE}"

