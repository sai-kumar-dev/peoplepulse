peoplepulse:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5434') | int }}"
      user: "{{ env_var('DBT_USER', 'peoplepulse') }}"
      password: "{{ env_var('DBT_PASSWORD', 'peoplepulse') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'people_warehouse') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      connect_timeout: 10
      retries: 2
      keepalives_idle: 0
    ci:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5434') | int }}"
      user: "{{ env_var('DBT_USER', 'peoplepulse') }}"
      password: "{{ env_var('DBT_PASSWORD', 'peoplepulse') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'people_warehouse') }}"
      schema: analytics_ci
      threads: 2
      connect_timeout: 10
      retries: 1
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'not-configured') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'not-configured') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', 'not-configured') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'PEOPLEPULSE_TRANSFORMER') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'PEOPLEPULSE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'PEOPLEPULSE_TRANSFORMING') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS') }}"
      threads: "{{ env_var('DBT_THREADS', '8') | int }}"
      client_session_keep_alive: false
      query_tag: peoplepulse_dbt
