[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peoplepulse"
version = "0.1.0"
description = "A governed, local-first people analytics data platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "PeoplePulse Contributors" }]
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pandas>=2.2,<4",
  "plotly>=5.24,<8",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-json-logger>=3.2,<5",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "streamlit>=1.41,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<3",
  "pre-commit>=4,<5",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-requests>=2.32,<3",
]
dbt = [
  "dbt-core>=1.9,<1.13",
  "dbt-postgres>=1.9,<1.12",
]
snowflake = [
  "dbt-snowflake>=1.9,<1.13",
  "snowflake-connector-python>=3.12,<6",
  "snowflake-sqlalchemy>=1.7,<3",
]

[project.scripts]
peoplepulse-generate = "data_generator.generate:main"
peoplepulse-ingest = "ingestion.cli:main"
peoplepulse-quality = "peoplepulse.quality.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "peoplepulse*",
  "data_generator*",
  "ingestion*",
  "api*",
  "dashboard*",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=peoplepulse --cov=data_generator --cov=ingestion --cov=api --cov-report=term-missing --cov-report=xml"
testpaths = ["tests", "api/tests", "ingestion/tests", "data_generator/tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires a database or running service",
  "e2e: executes the complete local vertical slice",
]

[tool.coverage.run]
branch = true
omit = [
  "airflow/*",
  "dashboard/app.py",
  "*/tests/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["dbt/target", "dbt/dbt_packages", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "DTZ", "RUF", "S"]
ignore = [
  "S101",
  "S105",
  "S106",
  "S608",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S311"]
"api/tests/**/*.py" = ["S101"]
"data_generator/**/*.py" = ["S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
exclude = [
  "dbt/",
  "airflow/",
  "dashboard/",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "pandas.*",
  "plotly.*",
  "prometheus_client.*",
  "psycopg.*",
  "streamlit.*",
]
ignore_missing_imports = true

