name: peoplepulse

x-app-environment: &app-environment
  PEOPLEPULSE_ENVIRONMENT: ${PEOPLEPULSE_ENVIRONMENT:-local}
  PEOPLEPULSE_LOG_LEVEL: ${PEOPLEPULSE_LOG_LEVEL:-INFO}
  PEOPLEPULSE_WAREHOUSE_BACKEND: ${PEOPLEPULSE_WAREHOUSE_BACKEND:-postgres}
  PEOPLEPULSE_SOURCE_DATABASE_URL: postgresql+psycopg://peoplepulse:peoplepulse@source-db:5432/people_source
  PEOPLEPULSE_WAREHOUSE_DATABASE_URL: postgresql+psycopg://peoplepulse:peoplepulse@warehouse:5432/people_warehouse
  PEOPLEPULSE_ASYNC_DATABASE_URL: postgresql+asyncpg://peoplepulse:peoplepulse@warehouse:5432/people_warehouse
  PEOPLEPULSE_DATABASE_URL: postgresql+asyncpg://peoplepulse:peoplepulse@warehouse:5432/people_warehouse
  PEOPLEPULSE_WAREHOUSE_SCHEMA: marts
  PEOPLEPULSE_DATA_DIR: /opt/peoplepulse/data/generated
  PEOPLEPULSE_ADMIN_TOKEN: ${PEOPLEPULSE_ADMIN_TOKEN:-local-admin-change-me}
  PEOPLEPULSE_ANALYST_TOKEN: ${PEOPLEPULSE_ANALYST_TOKEN:-local-analyst-change-me}
  PEOPLEPULSE_PII_MASKING_MODE: ${PEOPLEPULSE_PII_MASKING_MODE:-strict}
  PEOPLEPULSE_DATA_GENERATOR_SEED: ${PEOPLEPULSE_DATA_GENERATOR_SEED:-42}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infrastructure/docker/airflow.Dockerfile
  restart: unless-stopped
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    <<: *app-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    DBT_PROFILES_DIR: /opt/peoplepulse/dbt
  volumes:
    - airflow_logs:/opt/airflow/logs
    - generated_data:/opt/peoplepulse/data/generated
  depends_on:
    airflow-db:
      condition: service_healthy
    source-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  source-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: peoplepulse
      POSTGRES_PASSWORD: peoplepulse
      POSTGRES_DB: people_source
    ports:
      - "${PEOPLEPULSE_SOURCE_DB_PORT:-5433}:5432"
    volumes:
      - source_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/source:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peoplepulse -d people_source"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [peoplepulse]

  warehouse:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: peoplepulse
      POSTGRES_PASSWORD: peoplepulse
      POSTGRES_DB: people_warehouse
    ports:
      - "${PEOPLEPULSE_WAREHOUSE_DB_PORT:-5434}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/warehouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peoplepulse -d people_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [peoplepulse]

  airflow-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [peoplepulse]

  airflow-init:
    <<: *airflow-common
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        airflow users create
        --username "${AIRFLOW_ADMIN_USERNAME:-admin}"
        --password "${AIRFLOW_ADMIN_PASSWORD:-admin}"
        --firstname People
        --lastname Pulse
        --role Admin
        --email admin@localhost
        || true
    networks: [peoplepulse]

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${PEOPLEPULSE_AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
    networks: [peoplepulse]

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 12
    networks: [peoplepulse]

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 12
    networks: [peoplepulse]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *app-environment
    command: ["uvicorn", "api.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${PEOPLEPULSE_API_PORT:-8000}:8000"
    volumes:
      - generated_data:/opt/peoplepulse/data/generated
    depends_on:
      warehouse:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs: [/tmp]
    networks: [peoplepulse]

  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *app-environment
      PEOPLEPULSE_API_BASE_URL: http://api:8000
    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
      ]
    ports:
      - "${PEOPLEPULSE_DASHBOARD_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs: [/tmp]
    networks: [peoplepulse]

  dbt:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      target: dbt
    environment:
      DBT_PROFILES_DIR: /opt/peoplepulse/dbt
      DBT_HOST: warehouse
      DBT_PORT: 5432
      DBT_USER: peoplepulse
      DBT_PASSWORD: peoplepulse
      DBT_DATABASE: people_warehouse
      DBT_SCHEMA: analytics
    working_dir: /opt/peoplepulse/dbt
    depends_on:
      warehouse:
        condition: service_healthy
    networks: [peoplepulse]

  test:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      target: test
    environment:
      <<: *app-environment
      PEOPLEPULSE_WAREHOUSE_DATABASE_URL: "sqlite+pysqlite:///:memory:"
      PEOPLEPULSE_ASYNC_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      PEOPLEPULSE_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    command: ["pytest"]
    networks: [peoplepulse]

volumes:
  source_data:
  warehouse_data:
  airflow_metadata:
  airflow_logs:
  generated_data:

networks:
  peoplepulse:
    driver: bridge
